[package]
name = "vigia-core"
description = "Watch and diff engine for vigia. No terminal I/O."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
gix.workspace = true
notify.workspace = true
syntect.workspace = true

# Test fixtures are built by shelling out to `git` (see tests/support) rather
# than through a fixture crate. That keeps the dependency list exactly what
# SPEC.md names, and has the side benefit of proving gix against repositories
# real git wrote rather than ones we wrote ourselves.
[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "engine"
harness = false
