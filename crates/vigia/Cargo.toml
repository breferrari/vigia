[package]
name = "vigia"
description = "A live diff monitor for the terminal."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
authors.workspace = true
keywords = ["git", "diff", "tui", "monitor", "terminal"]
categories = ["command-line-utilities", "development-tools"]

# `SPEC.md` section 9 counts fourteen *files* here that read outside this
# package: thirteen reach `vigia-core/tests/support` by `#[path]`, and two read
# repository documents through `CARGO_MANIFEST_DIR`, of which `soak.rs` is in
# both groups and `package.rs` is the fourteenth. No destination is inside this
# directory, so a packaged copy carries a test suite that cannot compile.
#
# Excluding the tests is section 9's own resolution, and the direction is the
# point: it stops the *package* claiming a suite it cannot build, it does not
# stop the repository testing itself. Every gate still runs in a checkout, which
# is the only place they were ever meaningful, since thirteen of the fourteen
# reach fixtures a published crate has no business shipping and the fourteenth
# reads this repository's own documents.
#
# `crates/vigia/tests/package.rs` is what keeps this honest. A fifteenth escape
# added somewhere this pattern does not cover fails there, rather than at
# somebody's `cargo install`.
exclude = ["tests/**"]

[dependencies]
ratatui.workspace = true
vigia-core.workspace = true

# Here and not in `vigia-core`, because the memory readout is a drawn thing:
# SPEC.md section 6 keeps the core free of anything the shell decides, and a
# number that exists to be painted is the shell's. Linux is deliberately absent
# from the two blocks immediately below, since `/proc/self/status` needs no
# crate and no `unsafe`. So does every other target, which reports the readout
# unavailable rather than guessing.
[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true

# Two things on this one target, and they arrive by different routes: the
# memory readout above, and `Win32_System_Console` for the externally delivered
# signal, which is a feature of this same crate rather than a dependency of its
# own.
[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

# Every Unix, including Linux, which is what separates this block from the two
# above: a signal is not a readout, and `std` has no API for one anywhere. The
# shell rather than the core for the same reason as the pair above, one step
# further out. Taking a terminal is the shell's, so giving it back on a signal
# nobody typed is too, and SPEC.md section 6 puts terminal I/O outside
# `vigia-core` entirely.
[target.'cfg(unix)'.dependencies]
signal-hook.workspace = true

# The tests reach `vigia-core/tests/support` by `#[path]`, the way
# `vigia-core/benches/engine.rs` does, so a shell test and an engine gate cannot
# drift into measuring different repositories. That module shells out to real
# `git`, which is also what keeps this list exactly what SPEC.md names.
#
# `tests/soak.rs` reaches one step further out, to `.github/workflows/soak.yml`
# through `CARGO_MANIFEST_DIR`, so that a CI invariant with no other home is
# enforced by `cargo test` rather than by a shell step that only ubuntu ever
# runs. Of the four tests that read it, one holds everywhere; the three that
# execute the workflow's own shell need a working `bash`, and print a skip
# rather than passing quietly where none answers. That is Linux and macOS in
# CI: a Windows runner's `bash` is WSL's launcher with no distribution behind
# it, which starts and then fails, so those three skip there. Both escapes assume a checkout of
# this repository: neither survives a packaged or vendored copy, where `.github`
# is not in the `.crate` tarball at all. That is a constraint on SPEC.md section
# 9's publish rather than a reason to weaken either gate, and the `#[path]` one
# above breaks harder and earlier, at compile time.
[dev-dependencies]
insta.workspace = true
