# The grammar-dump builder. A workspace member so `cargo run -p xtask` works
# from a checkout, and `publish = false` because it is a tool of this repo, not
# a product of it: nothing in the shipped graph depends on it, which is what
# keeps `two-face` and the `yaml-load`/`dump-create` halves of `syntect` out of
# the published crates entirely (SPEC.md section 6).
[package]
name = "xtask"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
# bat's curated grammar set, packaged for syntect, in the fancy-regex-vetted
# variant. The feature choice is the whole point: every definition it ships
# compiles under the engine vigia actually runs, where the onig variant would
# hand us grammars that abort the monitor on first use (SPEC.md section 6).
two-face = { version = "0.5.2", default-features = false, features = [
    "syntect-fancy",
] }
# The build-time half of syntect: yaml-load reads the locally vendored
# .sublime-syntax files, dump-create serialises the merged set. Upstream, not
# the fork, because `two-face` hands over upstream's types; pinned to the
# fork's base by `package.rs`.
syntect = { version = "=5.3.0", default-features = false, features = [
    "parsing",
    "dump-load",
    "regex-fancy",
    "yaml-load",
    "dump-create",
] }

# The scene bed's images, from the generators the tests share. Already in the
# workspace graph, and nothing here ships.
image.workspace = true

[dev-dependencies]
# The scene bed's tests read the scene through the core and draw it through
# the pane, as a reader's pane would.
ratatui.workspace = true
ratatui-image.workspace = true
vigia = { path = "../crates/vigia" }
vigia-core.workspace = true

[lints]
workspace = true
