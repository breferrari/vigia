name: ci

on:
  push:
    branches: [main]
  pull_request:
    # `ready_for_review` is not a default type. take-next waits for the run it
    # starts.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_WARNINGS: deny

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

# The slow suites (budgets, benches, the musl build, the forks' own suites)
# run in `nightly.yml`.
jobs:
  # A pull request that changes only documents runs the docs job alone.
  # `change-class.sh` lists what counts as a document.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      class: ${{ steps.class.outputs.class }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: class
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            git diff --name-only --no-renames HEAD^1 HEAD > changed
          else
            : > changed
          fi
          out=$(sh .github/scripts/change-class.sh < changed)
          printf '%s\n' "$out"
          echo "class=$(printf '%s\n' "$out" | tail -1)" >> "$GITHUB_OUTPUT"
        env:
          EVENT_NAME: ${{ github.event_name }}

  lint:
    name: fmt and dist
    needs: [changes]
    if: needs.changes.outputs.class != 'docs'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt
      # The members by name: `--all` also formats the forks under `vendor/`.
      - run: cargo fmt -p vigia-core -p vigia -p xtask -- --check
      # `release.yml` is generated from `[workspace.metadata.dist]` and must match it.
      - name: the generated release workflow is current
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if curl --proto '=https' --tlsv1.2 -LsSf \
              https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh \
              | sh; then
              break
            fi
            [ "$attempt" -lt 3 ] || exit 1
            sleep $((attempt * 5))
          done
          dist generate --check

  test:
    name: test (${{ matrix.os }})
    needs: [changes]
    if: needs.changes.outputs.class != 'docs'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ${{ matrix.os }}-test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Per platform, because `cfg(windows)` and `cfg(target_os = "macos")`
      # code is not compiled on Linux.
      - run: cargo clippy --all-targets
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: nextest
      - name: test
        run: cargo nextest run --workspace --profile ci
        env:
          VIGIA_BUDGET_SLACK: "3"
      - name: doctests
        run: cargo test --workspace --doc

  msrv:
    name: minimum Rust
    needs: [changes]
    if: needs.changes.outputs.class != 'docs'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --workspace

  deny:
    name: dependencies
    needs: [changes]
    if: needs.changes.outputs.class != 'docs'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny check advisories licenses sources
      - run: cargo deny --exclude-dev check bans

  # Every pull request: the doc build, the PR title, and the suites that read
  # documents.
  docs:
    name: documents
    needs: [changes]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      # A title becomes a release note unless a commit body carries
      # `Release-note:`. The title arrives through env, never into the script.
      - name: title
        if: github.event_name == 'pull_request'
        run: sh .github/scripts/title-check.sh "origin/${BASE}"
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.base_ref }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ubuntu-latest-test
          save-if: false
      - name: docs build
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: nextest
      # A code pull request runs these in the test job.
      - name: the suites that read documents
        if: needs.changes.outputs.class == 'docs'
        run: |
          set -euo pipefail
          cargo nextest run -p vigia --profile ci --test package --test register --test sheet --test theme_docs
          cargo nextest run -p vigia-core --profile ci --test coverage

  # mcs ships for macOS only. The registry runs this same validator, and it
  # exits 0 on warnings, so the output is what fails the job.
  pack:
    name: tech pack
    needs: [changes]
    if: needs.changes.outputs.class != 'docs'
    runs-on: macos-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - run: brew install mcs-cli/tap/mcs
      - run: |
          set -euo pipefail
          out=$(mcs pack validate .)
          printf '%s\n' "$out"
          if printf '%s\n' "$out" | grep -Eq '^\[(WARN|ERROR)\]'; then
            exit 1
          fi

  zizmor:
    name: workflow audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: zizmor@1.31.1
      - run: zizmor --offline --config .github/zizmor.yml .github/workflows

  # The one required check. A skipped job passes, so a documents-only pull
  # request is green with the docs job alone.
  ci-complete:
    name: ci complete
    if: always()
    needs: [changes, lint, test, msrv, deny, docs, pack, zizmor]
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "every job that ran passed"
