name: ci

on:
  push:
    branches: [main]
  pull_request:
    # `ready_for_review` is **not** a default type, and the jobs below skip
    # drafts. Without it the two halves cancel out: a draft is skipped while it
    # is a draft, and marking it ready fires no event, so a PR could reach
    # mergeable having never been checked once. The other three are the
    # defaults, restated because naming any type replaces the whole list.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # A warning that reaches main is a warning nobody will ever fix.
  RUSTFLAGS: -D warnings

concurrency:
  group: ci-${{ github.ref }}
  # On a branch, only the newest push is worth checking. On main every commit
  # gets a full run: superseding them means the slowest leg, which is Windows,
  # is the one perpetually cancelled, and a commit nobody verified lands looking
  # like it was.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Every job below carries `if: github.event.pull_request.draft != true`, and it
# is written five times rather than once because a workflow has no place to say
# it once. What it buys: a branch iterates inside a draft for free, and the full
# matrix runs when the work is claimed to be finished rather than on every push
# toward finishing it. One PR spent nine runs converging here before this
# existed. `github.event.pull_request` is null outside a pull request, so `push`
# on main and `workflow_dispatch` are unaffected — `null != true` is true.
#
# It is a cost rule, not a correctness rule. Nothing merges without these having
# run: the same jobs fire on `ready_for_review`, and branch protection reads the
# result of that run rather than of a run that was skipped.
jobs:
  lint:
    name: fmt and clippy
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets

  test:
    name: test and budgets (${{ matrix.os }})
    if: github.event.pull_request.draft != true
    runs-on: ${{ matrix.os }}
    strategy:
      # Windows and macOS fail for different reasons than Linux does, and
      # cancelling the others hides which.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Correctness first, in debug, where the structural budget gates still
      # apply and the absolute ones report that they are skipped.
      - name: test
        run: cargo test --workspace

      # Then the budgets, in release, because that is what they were set
      # against. Slack applies to the absolute wall-clock gates only: hosted
      # runners are shared, and their variance is not a property of this code.
      # The structural gates take no slack and are what catch a real regression.
      - name: budgets
        run: cargo test --release --test budgets
        env:
          VIGIA_BUDGET_SLACK: "3"

  benches:
    name: benches compile
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Not run for timings: a hosted runner cannot produce a number worth
      # comparing. Compiled so they cannot rot unnoticed.
      - run: cargo bench --no-run

  pure-rust:
    name: no C toolchain
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # CLAUDE.md calls a C toolchain in the graph a spec change, not an
      # implementation detail. This is that rule with teeth: it is the whole
      # reason musl-static and Windows are cheap.
      # The list must cover every target `[workspace.metadata.dist]` ships, and
      # `crates/vigia/tests/package.rs::the_targets_the_release_ships_are_the_targets_the_purity_gate_checks`
      # is what makes that a gate rather than a habit. It found this list one
      # target short on its first run: #12 added `x86_64-apple-darwin` to the
      # release and the purity rule had never heard of it, so a shipped binary
      # sat outside the check CLAUDE.md calls a spec-level rule.
      #
      # Checking more than the release ships is fine and this list may grow that
      # way. Checking less is the failure.
      - name: assert no cc, cmake or bindgen on any tier-1 target
        run: |
          set -euo pipefail
          status=0
          for target in \
            x86_64-unknown-linux-musl \
            x86_64-pc-windows-msvc \
            x86_64-apple-darwin \
            aarch64-apple-darwin
          do
            found=$(cargo tree --target "$target" -e normal,build \
              | grep -oiE '\bcc v[0-9.]+|\bcmake v[0-9.]+|\bbindgen v[0-9.]+' \
              | sort -u || true)
            if [ -n "$found" ]; then
              echo "::error::a C build dependency entered the graph for $target: $found"
              status=1
            else
              echo "$target: clean"
            fi
          done
          exit $status

  musl:
    name: static musl binary
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target x86_64-unknown-linux-musl
      # The claim in CLAUDE.md is a static binary with no cross-toolchain.
      # Building is half of it; being actually static is the other half.
      - name: assert the binary is static
        run: |
          set -euo pipefail
          binary=target/x86_64-unknown-linux-musl/release/vigia
          file "$binary"
          # A resolved shared library prints as `libfoo.so => /path`. Matching
          # on that rather than on ldd's summary line, which is "statically
          # linked" for a static-pie build and "not a dynamic executable" for a
          # plain one, so keying off either would misfire on the other.
          if ldd "$binary" 2>&1 | grep -q '=>'; then
            echo "::error::the musl binary links shared libraries"
            ldd "$binary" || true
            exit 1
          fi

      # Static and shipped are two different claims, and until #12 only the
      # first was checked here. `SPEC.md` §9 makes musl the *only* Linux artifact
      # a release produces, while every budget number in this repository was
      # taken on `ubuntu-latest` gnu in the `test` job above. So the binary Linux
      # users actually receive had never been measured against I7 or I9 at all,
      # which is §7's recurring shape one target over: a gate that is green about
      # something adjacent to the thing it looks like it covers.
      #
      # It is not a hypothetical difference. musl's allocator is a different
      # implementation with materially different behaviour under the allocation
      # pattern a frame produces, and this crate has hard per-frame budgets.
      #
      # No runner change is needed and that is why this is affordable: a static
      # musl test binary executes natively on a glibc host, so the same
      # `ubuntu-latest` that built it can run it. Same slack as the `test` job,
      # for the same reason: hosted runners are shared and their variance is not
      # a property of this code. The structural gates take no slack and are what
      # catch a real regression.
      - name: budgets, against the binary Linux actually ships
        run: cargo test --release --target x86_64-unknown-linux-musl --test budgets
        env:
          VIGIA_BUDGET_SLACK: "3"
