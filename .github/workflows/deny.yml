name: weekly advisories

# New advisories arrive without a code change, so main is checked against the
# advisory database every week, not only when a pull request runs.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  advisories:
    name: advisories on main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check advisories
