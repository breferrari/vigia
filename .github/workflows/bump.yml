# Cut a release from the Actions tab: pick which part of the version to raise,
# and this bumps it, commits, and hands off to `release.yml`.
#
# **Why this exists rather than `git tag vX.Y.Z && git push --tags`.** The tag
# form works and is two commands, but it puts the version number in a human's
# hands at the moment it becomes permanent: a crates.io version cannot be
# withdrawn, and the number has to agree in two places in `Cargo.toml` that are
# fifteen lines apart. Choosing *patch* from a list is a smaller decision than
# typing `0.1.1`, and it cannot be typed wrong.
#
# **The dispatch is the mechanism, and it is not a preference.** A tag pushed
# from a workflow using `GITHUB_TOKEN` does **not** trigger another workflow:
# GitHub suppresses it to prevent recursion. So the obvious build, bump then
# push a tag then let the tag-push release fire, silently does nothing and would
# need a second long-lived PAT to work around. `workflow_dispatch` is one of the
# two documented exceptions to that rule, so triggering the release directly
# works with the token this job already has and adds no secret. That is what
# `dispatch-releases = true` in `[workspace.metadata.dist]` is for, and it is
# also why `release.yml` no longer runs on a tag push at all.
#
# **The commit needs a second token, and that is a different problem from the
# one above.** `dispatch-releases` removes the need for a PAT to *start* the
# release; it says nothing about *writing* to `main`, which is protected by
# seven required status checks. A commit pushed with `GITHUB_TOKEN` triggers no
# workflow, by the same suppression rule the paragraph above relies on, so those
# checks can never arrive on it and the push is rejected with "7 of 7 required
# status checks are expected" however long anyone waits. The bot holds write
# rather than admin, so it cannot bypass them either. That is run 31435812487,
# the button's first real run, and it is why `RELEASE_TOKEN` exists: a
# repository-scoped token whose owner is an admin, so the push is a bypass the
# protection allows. Only the push and the pre-flight that proves it can push
# use that token.
#
# **Ordering is chosen so nothing is pushed before it is checked.** The version
# is edited, verified, and built *before* the commit, so a bump that produces an
# inconsistent manifest fails with `main` untouched and no release started. The
# check is not new: `crates/vigia/tests/package.rs` already fails when the two
# version strings disagree, because a `vigia` published against an older
# `vigia-core` is a real crate that resolves and installs and can never be
# unpublished.
name: bump and release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to raise
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      rehearse:
        description: Work out the version and build everything, publish nothing, leave main alone
        type: boolean
        default: false

# One release at a time. Two of these interleaving would race on the version
# they each read, and both would push.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  bump:
    name: bump ${{ inputs.bump }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Refuse anywhere but the default branch. The release is cut from `main`
      # and a bump committed to a branch would be a version nothing ever tags.
      - name: this runs on main or not at all
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/${DEFAULT}" ]; then
            echo "::error::dispatched against ${GITHUB_REF}; a release is cut from ${DEFAULT}"
            exit 1
          fi
        env:
          DEFAULT: ${{ github.event.repository.default_branch }}

      # **All three tokens, checked here, before the version moves.**
      #
      # v0.1.0 is why this step exists. `HOMEBREW_TAP_TOKEN` could read the tap
      # and not write to it, and nothing found out until the release was already
      # public: the formula job checked out the tap successfully and then failed
      # `git push` with a 403. Everything else had shipped by then, including the
      # irreversible half.
      #
      # **A read-only token passes a checkout**, which is the whole trap, so the
      # assertion is `push` specifically rather than that the token works at all.
      # Reading a *public* repository needs no grant, so a token scoped to
      # entirely the wrong repository still reads this one successfully.
      #
      # The registry token is only checked for presence, which is all that can be
      # checked without spending a publish. `publish-crates-io.yml` checks the
      # same thing again at its own start, and that is not redundant: this job
      # can be skipped, and that one is the last line before the permanent step.
      - name: the tokens can do what the release will ask of them
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not set; the release would build everything and never claim the version"
            exit 1
          fi
          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is not set; the formula would never reach the tap"
            exit 1
          fi
          if [ -z "${RELEASE_TOKEN:-}" ]; then
            echo "::error::RELEASE_TOKEN is not set; the bump would build everything and then fail to move ${DEFAULT}"
            echo "::error::Fine-grained token, Contents: Read and write, repository ${GITHUB_REPOSITORY} only, owned by an admin of it."
            exit 1
          fi

          # The tap's name comes from the release config rather than a copy here,
          # on the same rule as the no-C-toolchain job's target list.
          tap=$(cargo metadata --no-deps --format-version 1 | jq -r '.metadata.dist.tap')
          if [ -z "$tap" ] || [ "$tap" = "null" ]; then
            echo "::error::[workspace.metadata.dist] names no tap, but the homebrew publisher is enabled"
            exit 1
          fi

          # **A real write, then undo it.** `.permissions.push` was the first
          # spelling and it is a proxy that does not predict the thing: it
          # reported `true` for the very token whose `git push` had been denied
          # 403 during v0.1.0, because for a fine-grained token that field
          # reflects the user's role on the repository rather than the grants on
          # the token. A guard that passes for the token that already failed is
          # not a guard, and shipping one is worse than shipping none.
          #
          # So this creates a branch in the tap and deletes it. It goes through
          # the same auth path a formula commit does, so it asserts the
          # capability itself rather than a report about it, and it leaves
          # nothing behind. The tap holds no workflows, so a ref existing for a
          # second triggers nothing.
          head=$(curl -sS --max-time 30 -H "Authorization: Bearer ${HOMEBREW_TAP_TOKEN}" \
            "https://api.github.com/repos/${tap}/git/ref/heads/main" | jq -r '.object.sha // empty')
          if [ -z "$head" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN cannot even read ${tap}"
            exit 1
          fi

          probe="refs/heads/release-preflight-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          code=$(curl -sS -o probe.json -w '%{http_code}' --max-time 30 -X POST \
            -H "Authorization: Bearer ${HOMEBREW_TAP_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${tap}/git/refs" \
            -d "{\"ref\":\"${probe}\",\"sha\":\"${head}\"}")

          if [ "$code" != "201" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN cannot write to ${tap}: HTTP ${code}"
            echo "::error::$(jq -r '.message // empty' probe.json)"
            echo "::error::It can read ${tap}, which proves nothing: reading a public repo needs no grant."
            echo "::error::Fine-grained token: Contents must be Read and write, and ${tap} must be in its repository list."
            exit 1
          fi

          # **The undo is checked, because `curl -sS` exits 0 on a 403 and the
          # `||` arm below was therefore unreachable for the one failure it
          # names.** A ref left behind is not harmless the way the old wording
          # claimed: the ref name is derived from the run, so the *re-run* of a
          # failed release POSTs to a ref that already exists, gets a 422, and
          # reports a healthy token as broken. `GITHUB_RUN_ATTEMPT` in the name
          # fixes the collision; checking the code is what makes the warning
          # appear at all.
          gone=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 -X DELETE \
            -H "Authorization: Bearer ${HOMEBREW_TAP_TOKEN}" \
            "https://api.github.com/repos/${tap}/git/${probe}")
          if [ "$gone" != "204" ]; then
            echo "::warning::left ${probe} in ${tap} (HTTP ${gone}); delete it before the next release"
          fi

          # **The push to `${DEFAULT}` is the step no rehearsal reaches**, since
          # a rehearsal's whole promise is to leave it alone, and it is the step
          # that failed on the button's first real run. So it is checked here
          # instead, and it takes two separate things being true. Neither half
          # predicts the push on its own.
          #
          # **First half: the token's own grant, probed.** Same shape as the tap
          # probe above and for the same reason, against this repository: create
          # a ref, require the 201, delete it. This is what catches a token that
          # expired, that was scoped to the wrong repository, or that was created
          # without `Contents: Read and write`.
          #
          # **Outside `refs/heads/` on purpose, and that is structural rather
          # than careful.** A branch created by a PAT does raise events, unlike
          # one created by `GITHUB_TOKEN`, so a probe in `refs/heads/` is safe
          # only while no workflow here listens for a branch. That is true today
          # and nothing tests it, which by this repo's own rule is a wish.
          #
          # Two claims, and they rest on different things. That the namespace
          # *works* is measured: created, deleted, and never listed as a branch
          # in this repository. That it cannot raise a `push` or `create` event
          # rests on the documented trigger surface, where both events are
          # defined over branches and tags, and it is not something this check
          # observes.
          mine="refs/preflight/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          code=$(curl -sS -o mine.json -w '%{http_code}' --max-time 30 -X POST \
            -H "Authorization: Bearer ${RELEASE_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs" \
            -d "{\"ref\":\"${mine}\",\"sha\":\"$(git rev-parse HEAD)\"}")

          if [ "$code" != "201" ]; then
            echo "::error::RELEASE_TOKEN cannot write to ${GITHUB_REPOSITORY}: HTTP ${code}"
            echo "::error::$(jq -r '.message // empty' mine.json)"
            echo "::error::Fine-grained token: Contents must be Read and write, and ${GITHUB_REPOSITORY} must be in its repository list."
            exit 1
          fi

          gone=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 -X DELETE \
            -H "Authorization: Bearer ${RELEASE_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/${mine}")
          if [ "$gone" != "204" ]; then
            echo "::warning::left ${mine} in ${GITHUB_REPOSITORY} (HTTP ${gone}); delete it before the next release"
          fi

          # **Second half: the bypass, and this one is a rule check rather than a
          # probe. Saying so is the point.** The only true probe of "can this
          # token move a protected branch" is moving it, which is the
          # irreversible act everything here runs before, so this asserts the
          # documented condition under which the push is allowed instead of
          # pretending to have performed one.
          #
          # `.permissions.admin` is the field the first version of this guard was
          # wrong to use, and the question has changed rather than the field
          # having become trustworthy. **What it answers, exactly:** the
          # *authenticated user's role* on this repository, never the token's own
          # grants. That is why it once passed for a token already denied 403.
          # Bypassing a protected branch is a property of that role, so it is the
          # right instrument for this question, which is whether the account
          # behind the token is an admin here. It is still the wrong instrument
          # for "can this token write", and the probe above is what answers that
          # one. Neither covers the other, and this repository is public, so a
          # token with no grant on it at all would still read `admin: true`.
          #
          # What neither covers: that a fine-grained token *inherits* its owner's
          # bypass at push time. It is the premise the whole approach rests on,
          # no run has yet demonstrated it, and `RELEASE-SMOKE.md` §0 records it
          # as unproven rather than letting this step imply otherwise.
          code=$(curl -sS -o admin.json -w '%{http_code}' --max-time 30 \
            -H "Authorization: Bearer ${RELEASE_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}")
          if [ "$code" != "200" ]; then
            echo "::error::RELEASE_TOKEN cannot read ${GITHUB_REPOSITORY}: HTTP ${code}"
            exit 1
          fi
          if [ "$(jq -r '.permissions.admin // false' admin.json)" != "true" ]; then
            echo "::error::RELEASE_TOKEN's owner is not an admin of ${GITHUB_REPOSITORY}, so its push cannot bypass the required checks on ${DEFAULT}"
            exit 1
          fi

          # **Whether `${DEFAULT}` still lets admins bypass is deliberately not
          # checked, and that is a ruling rather than an omission.** Reading
          # branch protection needs admin rights on the API. The workflow's own
          # token cannot be granted them, because `administration` is not one of
          # the scopes a workflow may request under `permissions:`, and granting
          # them to `RELEASE_TOKEN` would widen a long-lived secret past
          # `Contents` to buy a better error message.
          #
          # A better error message is all it would buy. What this step exists to
          # prevent is an **irreversible half-step**: a version moved, a tag cut,
          # a crate published, against a token that cannot finish the job. A
          # protection setting that refuses the push is not one of those. The
          # push is the last thing before the release is dispatched, so it fails
          # with `${DEFAULT}` unmoved, no tag, and nothing published, which is
          # precisely what run 31435812487 did. That failure is already loud and
          # already safe, and paying a permanent widening of a secret to
          # rephrase it is the wrong trade.
          echo "::notice::three tokens present; real writes to ${tap} and ${GITHUB_REPOSITORY} succeeded and were undone"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          DEFAULT: ${{ github.event.repository.default_branch }}

      - name: work out the next version
        id: version
        run: |
          set -euo pipefail
          current=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "vigia") | .version')

          # Three numeric components and nothing else. A pre-release version is
          # refused rather than guessed at: what `patch` means for `0.2.0-rc.1`
          # is a judgement, and this job is for the case where it is not.
          if ! printf '%s' "$current" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::current version is ${current}, which this job will not bump automatically"
            exit 1
          fi

          IFS=. read -r major minor patch <<<"$current"
          case "${{ inputs.bump }}" in
            major) next="$((major + 1)).0.0" ;;
            minor) next="${major}.$((minor + 1)).0" ;;
            patch) next="${major}.${minor}.$((patch + 1))" ;;
            *) echo "::error::unknown bump ${{ inputs.bump }}"; exit 1 ;;
          esac

          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "::notice::${{ inputs.bump }}: $current -> $next"

      # Both strings, in one step, because moving one and not the other is the
      # failure this whole job is arranged around. The patterns are anchored to
      # the start of a line and each matches exactly one line in the manifest.
      - name: raise the version
        run: |
          set -euo pipefail
          next='${{ steps.version.outputs.next }}'
          sed -i -E "s|^version = \"[^\"]+\"|version = \"${next}\"|" Cargo.toml
          sed -i -E "s|^(vigia-core = \{ path = \"crates/vigia-core\", version = )\"[^\"]+\"|\1\"${next}\"|" Cargo.toml

          # Verify the edit rather than trusting the substitution, because a sed
          # that matched nothing exits 0 and leaves the old version in place.
          # `|| true`, because `grep -c` exits 1 when it counts nothing and
          # `set -e` would then kill the step on the assignment, before the
          # diagnostic below could say which line failed to move. Exactly the
          # case the diagnostic exists for is the case it was unreachable in.
          found=$(grep -cE "\"${next}\"" Cargo.toml || true)
          if [ "$found" -ne 2 ]; then
            echo "::error::expected both version strings at ${next}, found ${found}"
            grep -nE '^version = |^vigia-core = ' Cargo.toml
            exit 1
          fi
          cargo update --workspace

      # The gate that makes the sed above safe, run before anything is pushed.
      # It compares the two strings the edit touched and fails if they disagree.
      - name: the manifests agree
        run: cargo test -p vigia --test package the_internal_dependency_tracks_the_workspace_version

      # And the binary reports the new number, which is the claim a user checks.
      - name: the binary reports the new version
        run: |
          set -euo pipefail
          cargo build --release --locked
          got=$(./target/release/vigia --version)
          want='vigia ${{ steps.version.outputs.next }}'
          if [ "$got" != "$want" ]; then
            echo "::error::binary says '${got}', expected '${want}'"
            exit 1
          fi
          echo "::notice::${got}"

      - name: rehearsal stops here
        if: ${{ inputs.rehearse }}
        run: |
          echo "::notice::rehearsal: would release ${{ steps.version.outputs.next }}. main untouched."

      - name: commit the bump
        if: ${{ !inputs.rehearse }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "release: ${{ steps.version.outputs.next }}"

          # **Pushed with `RELEASE_TOKEN`, not with the token the checkout
          # carries**, and the credential is confined to this one step rather
          # than persisted into `.git/config` for the whole job. The header
          # explains why the workflow's own token cannot do this; the pre-flight
          # is what proves this one still can, before the version moved. Actions
          # masks a registered secret in log output, so a push that fails prints
          # the remote with `***` where the token is.
          git push "https://x-access-token:${RELEASE_TOKEN}@github.com/${GITHUB_REPOSITORY}" \
            "HEAD:${DEFAULT}"
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          DEFAULT: ${{ github.event.repository.default_branch }}

      # `dry-run` is `release.yml`'s own word for build-everything-publish-
      # nothing, so a rehearsal exercises the whole release path and stops short
      # of the irreversible step.
      - name: hand off to the release
        run: |
          set -euo pipefail
          tag='v${{ steps.version.outputs.next }}'
          if [ "${{ inputs.rehearse }}" = "true" ]; then tag=dry-run; fi
          gh workflow run release.yml --ref "${{ github.event.repository.default_branch }}" -f tag="$tag"
          echo "::notice::dispatched release.yml with tag=${tag}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # **The one failure that leaves the repository mid-release.** Everything
      # before the commit fails with nothing moved. After it, the version is on
      # `${DEFAULT}` and only the dispatch stands between that and a release, so
      # a dispatch that fails strands a bumped version nobody tagged: re-running
      # this workflow checks out the pre-bump commit and bumps past it, and the
      # stranded version becomes unreleasable by button.
      #
      # It is not retried automatically, because a dispatch that failed for a
      # reason nobody has read is not obviously safe to repeat. It is named
      # instead, with the one command that finishes the job.
      - name: say how to finish a release the dispatch did not start
        if: ${{ failure() && !inputs.rehearse }}
        run: |
          echo "::error::${{ steps.version.outputs.next }} may be committed to the default branch with no release dispatched."
          echo "::error::Check whether the bump landed, and if it did, finish it with:"
          echo "::error::  gh workflow run release.yml --ref ${{ github.event.repository.default_branch }} -f tag=v${{ steps.version.outputs.next }}"
