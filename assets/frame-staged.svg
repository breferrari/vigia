    <text class="m row" x="96" y="36" font-size="13.5" xml:space="preserve"><tspan class="fg">vigia · current </tspan><tspan class="cyn">▾</tspan><tspan class="fg"> · 4 changed · 2 staged</tspan> <tspan x="583.0" class="fg">watching</tspan></text>
