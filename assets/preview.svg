<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img"
     aria-label="Mockup of the vigia terminal interface: a pinned list of changed files with sparklines, heat strips and line counts, the file being read marked with a caret, above a syntax highlighted diff with a scrollbar and a heading that repeats the same row for the file being read, its dot marking the file that just changed, and a status bar showing frame time, resident memory and the follow state.">
  <defs>
    <clipPath id="win"><rect x="8" y="8" width="884" height="454" rx="12"/></clipPath>
    <style>
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace; }
      .fg { fill: #e6edf3 } .dim { fill: #7d8590 } .faint { fill: #6e7681 }
      .grn { fill: #3fb950 } .red { fill: #f85149 } .cyn { fill: #39c5cf }
      .kw { fill: #ff7b72 } .fnn { fill: #d2a8ff } .typ { fill: #ffa657 }
      .var { fill: #79c0ff } .con { fill: #e3b341 }
    </style>
  </defs>

  <rect x="8" y="8" width="884" height="454" rx="12" fill="#0d1117"/>

  <g clip-path="url(#win)">
    <!-- title bar -->
    <rect x="8" y="8" width="884" height="46" fill="#161b22"/>
    <!-- #323: the header's facts wear pills, the loud one on the first
         segment and the quiet one on the rest, with the separators left on the
         bar between them. Drawn before the text so the words sit on top, and
         only at truecolour: the depth ladder drops these backgrounds with
         every other one, which is why this is the `dark` picture. -->
    <rect x="94" y="16" width="58" height="30" rx="6" fill="#173042"/>
    <rect x="160" y="16" width="51" height="30" rx="6" fill="#21262d"/>
    <rect x="220" y="16" width="92" height="30" rx="6" fill="#21262d"/>
    <circle cx="34" cy="31" r="6" fill="#f85149"/>
    <circle cx="54" cy="31" r="6" fill="#e3b341"/>
    <circle cx="74" cy="31" r="6" fill="#3fb950"/>
    <text class="m fg" x="102" y="36" font-size="14" font-weight="700">vigia</text>
    <text class="m fg" x="152" y="36" font-size="14" font-weight="700">&#183; main &#183; 3 changed</text>
    <text class="m dim" x="866" y="36" font-size="13" text-anchor="end">watching</text>

    <!-- file rows -->
    <g font-size="13.5">
      <!-- #173: the caret stands on the pane's OWN edge, x=8, which is where
           the row washes and the region rule already reach. It used to sit at
           x=16, one cell in, while the shell insets the list by the caret, so a
           status sigil sat two columns right of the same sigil on the heading
           below. The marker is outside the text it points at now, and the clear
           cell after it is the pane's own margin rather than the caret's. -->
      <text class="m cyn" x="8.0" y="92">&#9656;</text>
      <text class="m dim" x="24.2" y="92">M</text>
      <!-- The caret's row draws its whole path bold: the weight is the caret's
           second channel, #193. -->
      <text class="m fg" x="40.4" y="92" font-weight="700">src/engine/watch.rs</text>
      <!-- **Pulse, heat, sparkline, counts, left to right**, which is the order
           `Painter::file_row` draws and which this picture did not. It placed
           the sparkline first, then the counts, then the heat strip, with the
           pulse away at the right-hand edge, and SPEC.md 5.1 carried that as its
           third departure. Corrected 2026-08-17 on the reader's ruling, and the
           columns are the real ones: measured from a 109-column render, which is
           this canvas exactly at one cell of 8.1px. -->
      <circle cx="595.2" cy="87" r="4" fill="#39c5cf"/>
      <g>
        <rect x="607.4" y="82" width="7" height="8" rx="2" fill="#3fb950"/>
        <rect x="615.5" y="82" width="7" height="8" rx="2" fill="#3fb950"/>
        <rect x="623.6" y="82" width="7" height="8" rx="2" fill="#56d364"/>
        <rect x="631.7" y="82" width="7" height="8" rx="2" fill="#56d364"/>
        <rect x="639.8" y="82" width="7" height="8" rx="2" fill="#7ee787"/>
        <rect x="647.9" y="82" width="7" height="8" rx="2" fill="#3fb950"/>
        <rect x="656.0" y="82" width="7" height="8" rx="2" fill="#f85149"/>
        <rect x="664.1" y="82" width="7" height="8" rx="2" fill="#21262d"/>
        <rect x="672.2" y="82" width="7" height="8" rx="2" fill="#21262d"/>
        <rect x="680.3" y="82" width="7" height="8" rx="2" fill="#21262d"/>
        <rect x="688.4" y="82" width="7" height="8" rx="2" fill="#21262d"/>
        <rect x="696.5" y="82" width="7" height="8" rx="2" fill="#21262d"/>
      </g>
      <g>
        <rect x="712.7" y="86" width="7" height="4" rx="1.5" fill="#39c5cf"/>
        <rect x="720.8" y="82" width="7" height="8" rx="1.5" fill="#5cd7df"/>
        <rect x="728.9" y="76" width="7" height="14" rx="1.5" fill="#7ae9f0"/>
        <rect x="737.0" y="70" width="7" height="20" rx="1.5" fill="#8aecf2"/>
        <rect x="745.1" y="66" width="7" height="24" rx="1.5" fill="#a8f2f7"/>
        <rect x="753.2" y="74" width="7" height="16" rx="1.5" fill="#7ae9f0"/>
        <rect x="761.3" y="82" width="7" height="8" rx="1.5" fill="#5cd7df"/>
        <rect x="769.4" y="86" width="7" height="4" rx="1.5" fill="#39c5cf"/>
      </g>
      <text class="m grn" x="826.1" y="92" text-anchor="end">+42</text>
      <text class="m red" x="874.7" y="92" text-anchor="end">&#8722;7</text>

      <text class="m dim" x="24.2" y="124">M</text>
      <text class="m fg" x="40.4" y="124">src/render/<tspan font-weight="700">frame.rs</tspan></text>
      <g>
        <rect x="607.4" y="114" width="7" height="8" rx="2" fill="#3fb950"/>
        <rect x="615.5" y="114" width="7" height="8" rx="2" fill="#56d364"/>
        <rect x="623.6" y="114" width="7" height="8" rx="2" fill="#f85149"/>
        <rect x="631.7" y="114" width="7" height="8" rx="2" fill="#21262d"/>
        <rect x="639.8" y="114" width="7" height="8" rx="2" fill="#21262d"/>
        <rect x="647.9" y="114" width="7" height="8" rx="2" fill="#21262d"/>
        <rect x="656.0" y="114" width="7" height="8" rx="2" fill="#21262d"/>
        <rect x="664.1" y="114" width="7" height="8" rx="2" fill="#21262d"/>
        <rect x="672.2" y="114" width="7" height="8" rx="2" fill="#21262d"/>
        <rect x="680.3" y="114" width="7" height="8" rx="2" fill="#21262d"/>
        <rect x="688.4" y="114" width="7" height="8" rx="2" fill="#21262d"/>
        <rect x="696.5" y="114" width="7" height="8" rx="2" fill="#21262d"/>
      </g>
      <g>
        <rect x="712.7" y="120" width="7" height="2" rx="1.5" fill="#39c5cf"/>
        <rect x="720.8" y="116" width="7" height="6" rx="1.5" fill="#5cd7df"/>
        <rect x="728.9" y="112" width="7" height="10" rx="1.5" fill="#7ae9f0"/>
        <rect x="737.0" y="116" width="7" height="6" rx="1.5" fill="#5cd7df"/>
        <rect x="745.1" y="118" width="7" height="4" rx="1.5" fill="#39c5cf"/>
        <rect x="753.2" y="120" width="7" height="2" rx="1.5" fill="#39c5cf"/>
        <rect x="761.3" y="120" width="7" height="2" rx="1.5" fill="#39c5cf"/>
        <rect x="769.4" y="120" width="7" height="2" rx="1.5" fill="#39c5cf"/>
      </g>
      <text class="m grn" x="826.1" y="124" text-anchor="end">+11</text>
      <text class="m red" x="874.7" y="124" text-anchor="end">&#8722;3</text>

      <text class="m dim" x="24.2" y="156">M</text>
      <text class="m dim" x="40.4" y="156">Cargo.toml</text>
      <g>
        <rect x="607.4" y="146" width="7" height="8" rx="2" fill="#3fb950"/>
        <rect x="615.5" y="146" width="7" height="8" rx="2" fill="#21262d"/>
        <rect x="623.6" y="146" width="7" height="8" rx="2" fill="#21262d"/>
        <rect x="631.7" y="146" width="7" height="8" rx="2" fill="#21262d"/>
        <rect x="639.8" y="146" width="7" height="8" rx="2" fill="#21262d"/>
        <rect x="647.9" y="146" width="7" height="8" rx="2" fill="#21262d"/>
        <rect x="656.0" y="146" width="7" height="8" rx="2" fill="#21262d"/>
        <rect x="664.1" y="146" width="7" height="8" rx="2" fill="#21262d"/>
        <rect x="672.2" y="146" width="7" height="8" rx="2" fill="#21262d"/>
        <rect x="680.3" y="146" width="7" height="8" rx="2" fill="#21262d"/>
        <rect x="688.4" y="146" width="7" height="8" rx="2" fill="#21262d"/>
        <rect x="696.5" y="146" width="7" height="8" rx="2" fill="#21262d"/>
      </g>
      <!-- The track, all eight buckets. This row is the dimmed one, and dim is
           the recency ladder's `cold` rung, which means *nothing is tracked for
           this path* rather than *this path is old*. So it can carry no bucket
           at all, and it used to draw eight of them. A state the tool cannot
           produce. Corrected for #78.

           Drawn in #30363d, which is Theme::dark's spark_track and NOT the
           #21262d the heat strip on this row uses. The two tracks differ on
           purpose: a sparkline track is one stroke where a heat slice is a solid
           block, and the same value behind a twelfth of the ink reads as
           absence. This picture is the specification, so it carries the value
           the shell actually draws rather than the one its neighbour uses.

           One pixel tall where a written bucket's floor is two, because the
           shell separates the two by HEIGHT as well as colour: `_` against
           `&#9601;`. -->
      <g>
        <rect x="712.7" y="152" width="7" height="1" rx="1.5" fill="#30363d"/>
        <rect x="720.8" y="152" width="7" height="1" rx="1.5" fill="#30363d"/>
        <rect x="728.9" y="152" width="7" height="1" rx="1.5" fill="#30363d"/>
        <rect x="737.0" y="152" width="7" height="1" rx="1.5" fill="#30363d"/>
        <rect x="745.1" y="152" width="7" height="1" rx="1.5" fill="#30363d"/>
        <rect x="753.2" y="152" width="7" height="1" rx="1.5" fill="#30363d"/>
        <rect x="761.3" y="152" width="7" height="1" rx="1.5" fill="#30363d"/>
        <rect x="769.4" y="152" width="7" height="1" rx="1.5" fill="#30363d"/>
      </g>
      <text class="m grn" x="826.1" y="156" text-anchor="end">+2</text>
      <text class="m faint" x="874.7" y="156" text-anchor="end">&#8722;0</text>
    </g>

    <!-- focused file header -->
    <line x1="8" y1="178" x2="892" y2="178" stroke="#21262d" stroke-width="1"/>
    <!-- **Both regions draw a file the same way**, which is what the shell has
         always done and what this picture did not show. One Painter::file_row
         draws a summary row and a heading alike, so the heading carries the kind
         letter in the same column as the list above it (#173) and the same
         glance elements in the same slots. The reason the shell is right: the
         list is capped, so a file scrolled out of it would take its counters
         with it and leave nowhere to read them. -->
    <text class="m dim" x="24.2" y="202" font-size="13.5">M</text>
    <text class="m fg" x="40.4" y="202" font-size="13.5" font-weight="700">src/engine/watch.rs</text>
    <g font-size="13.5">
      <circle cx="595.2" cy="197" r="4" fill="#39c5cf"/>
      <g>
        <rect x="607.4" y="192" width="7" height="8" rx="2" fill="#3fb950"/>
        <rect x="615.5" y="192" width="7" height="8" rx="2" fill="#3fb950"/>
        <rect x="623.6" y="192" width="7" height="8" rx="2" fill="#56d364"/>
        <rect x="631.7" y="192" width="7" height="8" rx="2" fill="#56d364"/>
        <rect x="639.8" y="192" width="7" height="8" rx="2" fill="#7ee787"/>
        <rect x="647.9" y="192" width="7" height="8" rx="2" fill="#3fb950"/>
        <rect x="656.0" y="192" width="7" height="8" rx="2" fill="#f85149"/>
        <rect x="664.1" y="192" width="7" height="8" rx="2" fill="#21262d"/>
        <rect x="672.2" y="192" width="7" height="8" rx="2" fill="#21262d"/>
        <rect x="680.3" y="192" width="7" height="8" rx="2" fill="#21262d"/>
        <rect x="688.4" y="192" width="7" height="8" rx="2" fill="#21262d"/>
        <rect x="696.5" y="192" width="7" height="8" rx="2" fill="#21262d"/>
      </g>
      <g>
        <rect x="712.7" y="196" width="7" height="4" rx="1.5" fill="#39c5cf"/>
        <rect x="720.8" y="192" width="7" height="8" rx="1.5" fill="#5cd7df"/>
        <rect x="728.9" y="186" width="7" height="14" rx="1.5" fill="#7ae9f0"/>
        <rect x="737.0" y="180" width="7" height="20" rx="1.5" fill="#8aecf2"/>
        <rect x="745.1" y="176" width="7" height="24" rx="1.5" fill="#a8f2f7"/>
        <rect x="753.2" y="184" width="7" height="16" rx="1.5" fill="#7ae9f0"/>
        <rect x="761.3" y="192" width="7" height="8" rx="1.5" fill="#5cd7df"/>
        <rect x="769.4" y="196" width="7" height="4" rx="1.5" fill="#39c5cf"/>
      </g>
      <text class="m grn" x="826.1" y="202" text-anchor="end">+42</text>
      <text class="m red" x="874.7" y="202" text-anchor="end">&#8722;7</text>
    </g>

    <!-- diff -->
    <!-- Indentation is carried by explicit x offsets, never by leading spaces:
         xml:space="preserve" is honoured inconsistently and leading whitespace
         inside a tspan gets trimmed, which silently flattens every indent.
         One monospace cell at 13.5px is ~8.1px, so 4 spaces is ~32.4px. -->
    <g font-size="13.5">
      <text class="m faint" x="60" y="238" text-anchor="end">38</text>
      <text class="m" x="88" y="238"><tspan class="kw">fn </tspan><tspan class="fnn">coalesce</tspan><tspan class="fg">(&amp;</tspan><tspan class="kw">mut self</tspan><tspan class="fg">, </tspan><tspan class="var">ev</tspan><tspan class="fg">: </tspan><tspan class="typ">Event</tspan><tspan class="fg">) -&gt; </tspan><tspan class="typ">Option</tspan><tspan class="fg">&lt;</tspan><tspan class="typ">Frame</tspan><tspan class="fg">&gt; {</tspan></text>

      <!-- #321's two-tone gutter: the number cells of a changed row sit one
           tone off the wash, so the gutter reads as a column with no border
           spent. No word patch appears in this hunk because it holds no
           qualifying pair: self.flush() against None is past the pairing
           bound, so both rows keep the whole-line wash, which is exactly what
           the shell draws for them. -->
      <rect x="8" y="246" width="884" height="24" fill="#0f2c1c"/>
      <rect x="8" y="246" width="3" height="24" fill="#3fb950"/>
      <rect x="28" y="246" width="40" height="24" fill="#0a2013"/>
      <text class="m faint" x="60" y="264" text-anchor="end">39</text>
      <text class="m grn" x="72" y="264">+</text>
      <text class="m" x="120.4" y="264"><tspan class="kw">if self</tspan><tspan class="fg">.</tspan><tspan class="var">pending</tspan><tspan class="fg">.</tspan><tspan class="fnn">is_empty</tspan><tspan class="fg">() {</tspan></text>

      <rect x="8" y="272" width="884" height="24" fill="#0f2c1c"/>
      <rect x="8" y="272" width="3" height="24" fill="#3fb950"/>
      <rect x="28" y="272" width="40" height="24" fill="#0a2013"/>
      <text class="m faint" x="60" y="290" text-anchor="end">40</text>
      <text class="m grn" x="72" y="290">+</text>
      <text class="m" x="152.8" y="290"><tspan class="kw">self</tspan><tspan class="fg">.</tspan><tspan class="var">deadline</tspan><tspan class="fg"> = </tspan><tspan class="typ">Instant</tspan><tspan class="fg">::</tspan><tspan class="fnn">now</tspan><tspan class="fg">() + </tspan><tspan class="con">DEBOUNCE</tspan><tspan class="fg">;</tspan></text>

      <rect x="8" y="298" width="884" height="24" fill="#0f2c1c"/>
      <rect x="8" y="298" width="3" height="24" fill="#3fb950"/>
      <rect x="28" y="298" width="40" height="24" fill="#0a2013"/>
      <text class="m faint" x="60" y="316" text-anchor="end">41</text>
      <text class="m grn" x="72" y="316">+</text>
      <text class="m fg" x="120.4" y="316">}</text>

      <text class="m faint" x="60" y="342" text-anchor="end">42</text>
      <text class="m" x="120.4" y="342"><tspan class="kw">self</tspan><tspan class="fg">.</tspan><tspan class="var">pending</tspan><tspan class="fg">.</tspan><tspan class="fnn">insert</tspan><tspan class="fg">(</tspan><tspan class="var">ev</tspan><tspan class="fg">.</tspan><tspan class="var">path</tspan><tspan class="fg">);</tspan></text>

      <rect x="8" y="350" width="884" height="24" fill="#2d1416"/>
      <rect x="8" y="350" width="3" height="24" fill="#f85149"/>
      <rect x="28" y="350" width="40" height="24" fill="#1f0d0f"/>
      <text class="m faint" x="60" y="368" text-anchor="end">43</text>
      <text class="m red" x="72" y="368">&#8722;</text>
      <text class="m" x="120.4" y="368"><tspan class="kw">self</tspan><tspan class="fg">.</tspan><tspan class="fnn">flush</tspan><tspan class="fg">()</tspan></text>

      <rect x="8" y="376" width="884" height="24" fill="#0f2c1c"/>
      <rect x="8" y="376" width="3" height="24" fill="#3fb950"/>
      <rect x="28" y="376" width="40" height="24" fill="#0a2013"/>
      <text class="m faint" x="60" y="394" text-anchor="end">44</text>
      <text class="m grn" x="72" y="394">+</text>
      <text class="m kw" x="120.4" y="394">None</text>

      <text class="m faint" x="60" y="420" text-anchor="end">45</text>
      <text class="m fg" x="88" y="420">}</text>
    </g>

    <!-- diff scrollbar: file-granular plus the fraction within the current
         file, which is all SPEC.md 11.1 lets it know without reading every
         file's height. The pinned list above has no bar because all three of
         its rows are on screen.

         **Drawn after the diff, and that is load bearing rather than tidy.**
         SVG paints in document order, and a row wash spans x=8 width=884, which
         reaches x=892 and therefore covers this bar's x=872..878. Sitting where
         it used to, above the diff group, the washes buried it: the track showed
         on context rows and vanished on every added and removed one, so the bar
         read as dashes rather than as a column. Reported from the picture.

         A terminal cannot express the same mistake, because a cell holds one
         thing: the shell draws the bar and then hands the *narrowed* rect to the
         content. What it can express is the wash reaching into the bar's columns
         and overwriting cells already drawn, which is what #214 is open about. -->
    <rect x="882.8" y="190" width="6" height="250" rx="3" fill="#21262d"/>
    <rect x="882.8" y="190" width="6" height="82" rx="3" fill="#8b949e"/>

    <!-- status bar -->
    <rect x="8" y="432" width="884" height="30" fill="#161b22"/>
    <line x1="8" y1="432" x2="892" y2="432" stroke="#21262d" stroke-width="1"/>
    <!-- #80: the bar keeps q, f and ? and nothing else. It drew four hints, two
         of which named keys a reader can now find on the ? sheet instead. -->
    <text class="m faint" x="32" y="452" font-size="12.5">q quit  &#183;  f follow  &#183;  ? keys</text>
    <text class="m" x="866" y="452" font-size="12.5" text-anchor="end"><tspan class="cyn">0.8ms</tspan><tspan class="dim"> frame</tspan><tspan class="dim">&#160;&#160;&#160;</tspan><tspan class="cyn">24MiB</tspan><tspan class="dim">&#160;&#160;</tspan><tspan class="dim">follow </tspan><tspan class="grn">&#9654;</tspan><tspan class="dim">&#160;&#160;1/3</tspan></text>
  </g>

  <rect x="8.5" y="8.5" width="883" height="453" rx="12" fill="none" stroke="#30363d"/>
</svg>
