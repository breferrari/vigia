# The release targets, as in `[workspace.metadata.dist]`; `package.rs` keeps the
# two lists equal. Bans run with `--exclude-dev`, as the `no C toolchain` job
# reads only normal and build edges.

[graph]
targets = [
    "x86_64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
all-features = true

[advisories]
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2025-0141", reason = "bincode is unmaintained with no successor, and reaches vigia only through syntect: https://rustsec.org/advisories/RUSTSEC-2025-0141" },
    { id = "RUSTSEC-2024-0320", reason = "yaml-rust is unmaintained, and syntect declined the fork: https://github.com/trishume/syntect/pull/526" },
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
# An allowance the graph no longer needs fails, so the list stays what it needs.
unused-allowed-license = "deny"

# SPEC §6: nothing that needs a C toolchain.
[bans]
multiple-versions = "allow"
deny = [
    { crate = "cc", reason = "a C toolchain at build time" },
    { crate = "cmake", reason = "a C toolchain at build time" },
    { crate = "bindgen", reason = "a C toolchain at build time" },
    { crate = "onig_sys", reason = "the Oniguruma C library" },
    { crate = "aws-lc-sys", reason = "a C crypto library" },
    { crate = "ring", reason = "C and assembly at build time" },
    { crate = "openssl-sys", reason = "the OpenSSL C library" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
