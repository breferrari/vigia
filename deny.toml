# What `cargo deny check` holds the dependency graph to. The graph is the
# release targets' normal and build edges, the one the shipped binaries link
# and the one the `no C toolchain` job reads.

[graph]
targets = [
    "x86_64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
all-features = true
exclude-dev = true

[advisories]
yanked = "deny"
ignore = [
    # Unmaintained, through syntect, the settled highlighter; no upgrade exists.
    # https://rustsec.org/advisories/RUSTSEC-2025-0141
    { id = "RUSTSEC-2025-0141", reason = "bincode is unmaintained and has no successor version; it reaches vigia only through syntect" },
    # https://rustsec.org/advisories/RUSTSEC-2024-0320,
    # https://github.com/trishume/syntect/pull/526
    { id = "RUSTSEC-2024-0320", reason = "yaml-rust is unmaintained; syntect declined the fork in trishume/syntect#526" },
]

# Every licence the graph needs, from `cargo deny list`, and no more.
[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

# SPEC §6: nothing that needs a C toolchain.
[bans]
multiple-versions = "allow"
deny = [
    { crate = "cc", reason = "a C toolchain at build time" },
    { crate = "cmake", reason = "a C toolchain at build time" },
    { crate = "bindgen", reason = "a C toolchain at build time" },
    { crate = "onig_sys", reason = "the Oniguruma C library" },
    { crate = "aws-lc-sys", reason = "a C crypto library" },
    { crate = "ring", reason = "C and assembly at build time" },
    { crate = "openssl-sys", reason = "the OpenSSL C library" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
