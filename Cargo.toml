[workspace]
resolver = "3"
members = ["crates/vigia-core", "crates/vigia", "xtask"]

[workspace.package]
# Both crates move together, because both are published together and a registry
# will not take `vigia` until `vigia-core` resolves on it (SPEC.md section 9).
# Independent versions would buy nothing and cost a second tag format.
version = "0.30.3"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/breferrari/vigia"
# The same URL as `repository`, which is a duplicate and is kept deliberately.
# Measured both ways 2026-08-08: without it the generated Homebrew formula is
# byte-identical, because dist falls back to `repository`, **but `dist plan`
# emits `WARN The Homebrew publish job is enabled but no homepage was
# specified`** on every run. A standing warning on the one workflow whose log
# nobody can rehearse is worse than a field whose duplication is written down,
# because the warning is what a future reader stops to investigate.
homepage = "https://github.com/breferrari/vigia"
# The root README, shared by both crates. A registry page with no readme reads
# as abandoned, and `vigia-core` has nothing to say that this file does not say
# better: it is the engine behind the thing the reader came to look at.
readme = "README.md"
authors = ["Brenno Ferrari"]

[workspace.dependencies]
# The internal dependency, declared here rather than in `crates/vigia` so that
# its `version` is the workspace version rather than a second copy of it.
#
# A registry needs both halves: `path` is what a checkout builds against, and
# `version` is what `cargo publish` rewrites the dependency to, since crates.io
# has no paths. Written out in the shell's manifest, those two lived in
# different files from the version they had to match, and the failure is silent
# and permanent: bump the workspace to 0.2.0 with `version = "0.1.0"` still
# spelled here, and `cargo publish --workspace` ships `vigia` 0.2.0 depending on
# `vigia-core` **0.1.0**, which is a real published crate that resolves and
# builds. Nothing goes red, and nothing can be withdrawn afterwards.
#
# `version.workspace = true` inside a dependency is not a thing cargo supports,
# so the duplication cannot be removed, only moved and then gated. Moved: the
# two strings are now fifteen lines apart in one file rather than in two.
# Gated: `crates/vigia/tests/package.rs::the_internal_dependency_tracks_the_workspace_version`.
vigia-core = { path = "crates/vigia-core", version = "0.30.3" }
# Pure Rust throughout. Adding a dependency with a C build script is a spec
# change, not an implementation detail; see CLAUDE.md.
#
# `default-features = false` is deliberate. gix's defaults pull in credentials,
# mailmap, blame, worktree-archive and worktree-mutation, none of which a
# read-only monitor uses, and all of which cost startup against I7.
gix = { version = "0.86", default-features = false, features = [
    "status",
    "max-performance-safe",
    "sha1",
] }
# Native filesystem events, which I1 requires instead of a timer. The
# companion debouncer crate is deliberately not taken: coalesce policy lives in
# vigia-core, which is the only place I1 is testable.
notify = { version = "8.2", default-features = false, features = [
    "macos_fsevent",
] }
# Incremental re-highlighting, which is I2b. `default-features = false` is not
# tidiness here, it is the pure-Rust rule: syntect's default regex engine is
# `regex-onig`, which is oniguruma, which is C. Taking the defaults puts `cc` in
# the graph and costs musl-static and Windows tier-1. `regex-fancy` is the
# pure-Rust engine, and the `no C toolchain` CI job is what keeps it that way.
#
# `dump-load` reads the embedded grammar dump `xtask` builds (SPEC.md section
# 6), and brings `flate2` and `miniz_oxide`, which are pure Rust too.
# `default-syntaxes` is deliberately absent since #235: it is the superseded
# ST3-era snapshot, and carrying it beside the crate's own dump would be dead
# weight in the binary. `default-themes`, `html`, `plist-load` and `yaml-load`
# are off because the engine emits classes rather than colours (SPEC.md section
# 11.1): a theme is the shell's business, so loading one in the core would be
# paying for a decision made somewhere else.
syntect = { version = "5.3", default-features = false, features = [
    "parsing",
    "dump-load",
    "regex-fancy",
] }
# Named by SPEC.md section 7 for I4, I7 and I9. Trimmed: plotters and rayon
# only produce nicer local reports and cost CI compile time.
criterion = { version = "0.8", default-features = false, features = [
    "cargo_bench_support",
] }
# The `crossterm` feature is not a preference, it is SPEC.md section 6: ratatui
# also ships termion, termwiz and termina, and termion is Unix-only. It carries
# crossterm in as `ratatui::crossterm`, which is why crossterm is not declared
# separately. Two declarations of the same crate that drift apart by a major
# version become two incompatible `Event` types.
#
# Everything else is off, including the default widget set and macros. The shell
# writes cells directly: a `Paragraph` would wrap, and a wrapped diff line moves
# every line below it, so the shape of the screen stops meaning anything. Not
# taking the widgets also keeps `time` and its transitive tree out of the graph.
ratatui = { version = "0.30", default-features = false, features = [
    "crossterm",
] }
# Named by SPEC.md section 7 as the snapshot instrument. Defaults kept, unlike
# every pin above: the one default is coloured diffs, and a diff is the entire
# output of a failing snapshot test.
insta = "1.48"
# The status bar's memory readout, SPEC.md section 5.1, and on Windows one
# further thing the block below names. Both are FFI
# declarations against facilities the OS already ships, both are pinned to the
# version already resolved for that target, and neither adds a crate to any
# graph: gix pulls libc into the Apple graph through gix-hash and cpufeatures,
# and windows-sys 0.61 into the Windows graph through gix-sec. Confirmed with
# `cargo tree -i`, not from memory, which is the mistake SPEC.md section 6
# records.
#
# Named at the workspace root beside the rest even though only `vigia` takes
# them, so the whole dependency surface is readable in one file.
#
# Defaults kept, which is the opposite of every other pin here and is a
# judgement rather than an oversight. libc's only default is `std`, which is
# already in the graph, so turning it off buys nothing measurable; what it
# risks is a build break on the one tier-1 target that cannot be compiled on
# the reference machine, discovered in CI instead of here. A trim with no
# benefit is not worth paying for with a target you cannot test.
libc = "0.2"
# Three features, each the smallest set that answers, and they no longer answer
# for one section alone. ProcessStatus is GetProcessMemoryInfo and
# PROCESS_MEMORY_COUNTERS; Threading is GetCurrentProcess, whose pseudo-handle
# could be written as `-1` instead but would then be a magic number nobody could
# check against a header. Console is SetConsoleCtrlHandler and the CTRL_*
# constants, which is the Windows half of the externally delivered signal in
# SPEC.md section 6, and it adds no crate because a feature never does.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }
# The Unix half of that same decision, SPEC.md section 6. Windows has no
# signals, so the two halves are two crates rather than one behind a cfg.
#
# `default-features = false` with `iterator` put back is exactly what the
# default would give, since `iterator` implies `channel`. It is written out
# because every other pin here is, and because the feature that matters is the
# one left off: `extended-siginfo-raw` is what turns this crate's `build.rs`
# from `fn main() {}` into a `cc` invocation, and it is the only route from here
# into a C toolchain.
#
# Adds no crate either: crossterm already pulls it into both Unix graphs through
# ratatui. Confirmed with `cargo tree -i`, on the same rule as the pair above.
signal-hook = { version = "0.3", default-features = false, features = [
    "iterator",
] }

[profile.release]
# I7 (startup < 50ms) and I9 (p99 frame < 16ms) are measured against release.
lto = "thin"
# **Two, not one, and the reason is a Windows codegen cliff rather than a
# preference.** At `codegen-units = 1` the MSVC target compiles `fancy-regex`
# roughly 6x slower, and because `syntect` compiles every pattern lazily on
# first use, that cost lands on frames a reader is waiting for. Measured on
# Windows (#261): a 24-line `sh` fenced block cost 286.91ms of parse at 1 and
# 22.39ms at 2, and the cold parse behind I7's second frame went 107.88ms to
# 17.59ms. It is a cliff at 1, not a gradient: 2, 4, 8 and 16 are
# indistinguishable from each other.
#
# **It is a cliff on Windows only, which is why the number is here and the
# claim is not universal.** Re-measured on Linux (rustc 1.98.0) interleaved over
# three rounds against three separately built binaries, 1, 2 and 16 sit within
# 3% on every fixture, so nothing here buys Linux anything. macOS has never been
# measured; CI is the only instrument for it. Recording the platform matters
# because the first write-up of this treated the penalty as a property of the
# profile, and a profile is shared by four targets (SPEC.md section 9).
#
# Two rather than sixteen because the win saturates immediately and the cost
# does not: 2 is +3.5% binary on Windows and +3.2% on Linux, while 16 is +9.6%
# and +16.7% and pushes the bulk-rewrite p99 from 16.25ms to 18.01ms, over I9.
#
# Nothing gates this. Putting it back to 1 goes unnoticed on Linux and macOS by
# construction, since neither moves, and the Windows gates that would notice run
# on a shared runner with slack. Stated rather than papered over.
codegen-units = 2
panic = "abort"

# Benchmarks and the soak test need symbols without giving up optimisation.
# `panic` is deliberately absent: cargo ignores it for the bench profile.
[profile.bench]
inherits = "release"
debug = true

# The profile the release is built with, and it inherits `release` **and adds
# nothing**. That is a decision rather than a default: every budget in this
# repository (I7, I9, I3) is measured against `release`, so a `dist` profile that
# tuned anything would make every one of those numbers a claim about a binary
# nobody receives. dist's own suggested profile adds `lto = "thin"`, which
# `release` above already sets, so agreeing here costs nothing at all.
#
# `crates/vigia/tests/package.rs::the_profile_that_ships_is_the_profile_the_budgets_measure`
# is what stops it drifting, because nothing else would notice.
[profile.dist]
inherits = "release"

# `cargo-dist` 0.32, whose binary is named `dist`. SPEC.md section 9 is the
# contract; this is the machine-readable half of it.
#
# `publish-jobs` carries the registry job because **dist has no crates.io
# publisher**: its built-ins are `homebrew` and `npm`, and everything else is a
# custom reusable workflow. `./publish-crates-io` is
# `.github/workflows/publish-crates-io.yml`, and dist places every custom publish
# job `needs: [plan, host]`, which puts it **after** the GitHub release is
# already public: `host` runs `gh release create` with no `--draft`. That is the
# right order because crates.io is the only irreversible step in the release, so
# it goes last, after everything that can be deleted and redone has succeeded.
# The workflow's own header carries the full reasoning and what it costs.
#
# Four targets, and Linux is musl alone: one static binary that runs on any
# distribution beats two that need selection logic, and CLAUDE.md already names
# musl as this project's static-binary story. arm64 Linux and arm64 Windows are
# deferred on the cross linker, which section 9 records.
#
# No `msi` installer (WiX is a C toolchain question this repository has already
# answered elsewhere) and no `npm` (a second registry for no reader).
[workspace.metadata.dist]
cargo-dist-version = "0.32.0"
ci = ["github"]
# The release is triggered from the Actions tab rather than by a tag push, which
# is what lets `.github/workflows/bump.yml` start it. A tag pushed by a workflow
# holding `GITHUB_TOKEN` triggers nothing, because GitHub suppresses it to
# prevent recursion, and `workflow_dispatch` is one of the two documented
# exceptions. So this is the setting that removes the need for a second
# long-lived PAT, rather than a preference about where buttons live.
#
# It **disables tag-push releases**, which is the whole cost: `git tag v0.1.2 &&
# git push --tags` stops producing a release once this is on. `bump.yml` is the
# way in, and `release.yml`'s own dispatch form is the way to rehearse, since it
# defaults to the tag `dry-run`, meaning build everything and publish nothing.
dispatch-releases = true
# The grammar attribution rides along in every archive. The binary embeds a few
# hundred third-party grammars, each under its own licence, and `dist` puts
# README, LICENSE and CHANGELOG in an archive on its own but knows nothing about
# this one. `bat` and `two-face` both ship theirs with the artefact.
include = ["crates/vigia-core/assets/NOTICE.md"]
installers = ["shell", "powershell", "homebrew"]
tap = "breferrari/homebrew-tap"
publish-jobs = ["homebrew", "./publish-crates-io"]
targets = [
    "x86_64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
