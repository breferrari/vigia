[workspace]
resolver = "3"
members = ["crates/vigia-core", "crates/vigia"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/breferrari/vigia"
authors = ["Brenno Ferrari"]

[workspace.dependencies]
# Pure Rust throughout. Adding a dependency with a C build script is a spec
# change, not an implementation detail; see CLAUDE.md.
#
# `default-features = false` is deliberate. gix's defaults pull in credentials,
# mailmap, blame, worktree-archive and worktree-mutation, none of which a
# read-only monitor uses, and all of which cost startup against I7.
gix = { version = "0.86", default-features = false, features = [
    "status",
    "max-performance-safe",
    "sha1",
] }
# Native filesystem events, which I1 requires instead of a timer. The
# companion debouncer crate is deliberately not taken: coalesce policy lives in
# vigia-core, which is the only place I1 is testable.
notify = { version = "8.2", default-features = false, features = [
    "macos_fsevent",
] }
# Named by SPEC.md section 7 for I4, I7 and I9. Trimmed: plotters and rayon
# only produce nicer local reports and cost CI compile time.
criterion = { version = "0.8", default-features = false, features = [
    "cargo_bench_support",
] }
# The `crossterm` feature is not a preference, it is SPEC.md section 6: ratatui
# also ships termion, termwiz and termina, and termion is Unix-only. It carries
# crossterm in as `ratatui::crossterm`, which is why crossterm is not declared
# separately. Two declarations of the same crate that drift apart by a major
# version become two incompatible `Event` types.
#
# Everything else is off, including the default widget set and macros. The shell
# writes cells directly: a `Paragraph` would wrap, and a wrapped diff line moves
# every line below it, so the shape of the screen stops meaning anything. Not
# taking the widgets also keeps `time` and its transitive tree out of the graph.
ratatui = { version = "0.30", default-features = false, features = [
    "crossterm",
] }
# Named by SPEC.md section 7 as the snapshot instrument. Defaults kept, unlike
# every pin above: the one default is coloured diffs, and a diff is the entire
# output of a failing snapshot test.
insta = "1.48"

[profile.release]
# I7 (startup < 50ms) and I9 (p99 frame < 16ms) are measured against release.
lto = "thin"
codegen-units = 1
panic = "abort"

# Benchmarks and the soak test need symbols without giving up optimisation.
# `panic` is deliberately absent: cargo ignores it for the bench profile.
[profile.bench]
inherits = "release"
debug = true
